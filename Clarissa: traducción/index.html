<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clarissa — Traducción</title>
  <style>
    :root {
      --fondo: #f5f7fa;
      --tarjeta: #ffffff;
      --texto: #1f2937;
      --acento: #2563eb;
      --borde: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--fondo);
      color: var(--texto);
      line-height: 1.5;
    }

    .contenedor {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem 1rem 4rem;
    }

    header {
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      margin: 0 0 .25rem;
    }

    .subtitulo {
      color: #6b7280;
      margin: 0;
    }

    .indice {
      list-style: none;
      padding: 0;
      margin: 1.5rem 0 0;
      display: grid;
      gap: .75rem;
    }

    .indice li {
      background: var(--tarjeta);
      border: 1px solid var(--borde);
      border-radius: .75rem;
      transition: transform .15s, box-shadow .15s, border-color .15s;
    }

    .indice li:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,.06);
      border-color: #c7d2fe;
    }

    .indice a {
      display: block;
      padding: 1rem 1.1rem;
      color: var(--texto);
      text-decoration: none;
      font-weight: 500;
    }

    .indice a:hover {
      color: var(--acento);
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <header>
      <h1>Clarissa — Traducción</h1>
      <p class="subtitulo">5 partes disponibles</p>
    </header>

    <ul class="indice">
      <li><a href="Clarissa-traduccion/Clarissa_bilingüe_P1.html">Clarissa bilingüe — Parte 1</a></li>
      <li><a href="Clarissa-traduccion/Clarissa_bilingüe_P2.html">Clarissa bilingüe — Parte 2</a></li>
      <li><a href="Clarissa-traduccion/Clarissa_bilingüe_P3.html">Clarissa bilingüe — Parte 3</a></li>
      <li><a href="Clarissa-traduccion/Clarissa_bilingüe_P4.html">Clarissa bilingüe — Parte 4</a></li>
      <li><a href="Clarissa-traduccion/Clarissa_bilingüe_P5.html">Clarissa bilingüe — Parte 5</a></li>
    </ul>
  </div>
</body>
</html>
